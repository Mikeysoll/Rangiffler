name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build backends and compile E2E tests
        run: bash ./gradlew :rfr-auth:assemble :rfr-api:assemble :rfr-e2e:testClasses --no-daemon

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json

      - name: Install frontend dependencies
        working-directory: rfr-gql-client
        run: npm ci

      - name: Lint frontend
        working-directory: rfr-gql-client
        run: npm run lint

      - name: Build frontend
        working-directory: rfr-gql-client
        run: npm run build
