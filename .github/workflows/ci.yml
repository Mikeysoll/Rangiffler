name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      run_e2e: ${{ steps.changes.outputs.auth == 'true' || steps.changes.outputs.api == 'true' || steps.changes.outputs.e2e == 'true' || steps.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed modules
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          auth=false
          api=false
          e2e=false
          frontend=false
          files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")
          while IFS= read -r file; do
            case "$file" in
              *.md) continue ;;
            esac
            case "$file" in
              rfr-auth/*) auth=true ;;
              rfr-api/*) api=true ;;
              rfr-e2e/*) e2e=true ;;
              rfr-gql-client/*) frontend=true ;;
              build.gradle|settings.gradle|gradle.properties|gradlew|gradlew.bat|gradle/*|buildSrc/*)
                auth=true; api=true; e2e=true ;;
              .github/workflows/ci.yml|compose.yaml|scripts/*)
                auth=true; api=true; e2e=true; frontend=true ;;
            esac
          done <<< "$files"
          echo "auth=$auth" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        if: steps.changes.outputs.auth == 'true' || steps.changes.outputs.api == 'true' || steps.changes.outputs.e2e == 'true'
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build backends and compile E2E tests
        if: steps.changes.outputs.auth == 'true' || steps.changes.outputs.api == 'true' || steps.changes.outputs.e2e == 'true'
        env:
          AUTH_CHANGED: ${{ steps.changes.outputs.auth }}
          API_CHANGED: ${{ steps.changes.outputs.api }}
          E2E_CHANGED: ${{ steps.changes.outputs.e2e }}
        run: |
          tasks=()
          if [[ "$AUTH_CHANGED" == true ]]; then tasks+=(:rfr-auth:assemble); fi
          if [[ "$API_CHANGED" == true ]]; then tasks+=(:rfr-api:assemble); fi
          if [[ "$E2E_CHANGED" == true ]]; then tasks+=(:rfr-e2e:testClasses); fi
          bash ./gradlew "${tasks[@]}" --no-daemon

      - uses: actions/setup-node@v7
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: rfr-gql-client
        run: npm ci

      - name: Lint frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: rfr-gql-client
        run: npm run lint

      - name: Build frontend
        if: steps.changes.outputs.frontend == 'true'
        working-directory: rfr-gql-client
        run: npm run build

  e2e:
    needs: check
    if: needs.check.outputs.run_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - name: Install frontend dependencies
        working-directory: rfr-gql-client
        run: npm ci
      - name: Install Chromium and system dependencies
        run: bash ./gradlew :rfr-e2e:installPlaywrightWithDeps --no-daemon
      - name: Start stand and wait for readiness
        env:
          WAIT_TIMEOUT: '300'
        run: |
          started=$SECONDS
          trap 'echo "Stand startup: $((SECONDS - started)) seconds" >> "$GITHUB_STEP_SUMMARY"' EXIT
          docker compose up -d --wait mysql
          nohup bash ./gradlew runAll --console=plain > runAll.log 2>&1 &
          (cd rfr-gql-client && nohup npm run dev > ../front.log 2>&1 &)
          bash scripts/wait-for-stand.sh
      - name: Run E2E tests
        run: bash ./gradlew e2e --no-daemon
      - name: Collect MySQL logs
        if: always()
        run: docker compose logs --no-color mysql > mysql.log 2>&1
      - name: Upload test results and stand logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: |
            rfr-e2e/build/test-results/test/
            rfr-e2e/build/reports/tests/test/
            rfr-e2e/build/allure-results/
            rfr-e2e/allure-results/
            runAll.log
            front.log
            mysql.log
      - name: Stop MySQL
        if: always()
        run: docker compose stop mysql
